name: Deploy to GitHub Pages

# Every push to main rebuilds and republishes. `base: './'` in vite.config.js
# is what lets the same dist/ run from the repo subpath without a rebuild.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never let two deploys race; the newer one wins
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Requires Settings → Pages → Source: "GitHub Actions" to be set once,
      # by hand. The workflow's own token can deploy to a Pages site but is
      # not allowed to create one, so `enablement: true` here just fails with
      # "Resource not accessible by integration".
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
